backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Content", name: "body", widget: "markdown" }

  # HERO Sections
  - name: "hero_sections"
    label: "Hero Sections"
    folder: "content/sections/hero"
    create: true
    summary: "{{title}}"
    fields:
      - label: "Component Type"
        name: "component_type"
        widget: "string"
        default: "Hero Section"
        readonly: true
      - label: "Title"
        name: "title"
        widget: "string"
        default: "Hero Section Title"
      - label: "Text"
        name: "text"
        widget: "text"
        default: "Enter hero text here"
      - label: "Image"
        name: "image"
        widget: "image"
        default: "/images/placeholder.jpg"

  # TESTIMONIAL Sections
  - name: "testimonial_sections"
    label: "Testimonial Sections"
    folder: "content/sections/testimonial"
    create: true
    summary: "{{title}}"
    fields:
      - label: "Component Type"
        name: "component_type"
        widget: "string"
        default: "Testimonial Section"
        readonly: true
      - label: "Title"
        name: "title"
        widget: "string"
        default: "Testimonial Title"
      - label: "Text"
        name: "text"
        widget: "text"
        default: "Enter testimonial text here"
      - label: "Image"
        name: "image"
        widget: "image"
        default: "/images/placeholder.jpg"

  # GALLERY Sections
  - name: "gallery_sections"
    label: "Gallery Sections"
    folder: "content/sections/gallery"
    create: true
    summary: "{{title}}"
    fields:
      - label: "Component Type"
        name: "component_type"
        widget: "string"
        default: "Gallery Section"
        readonly: true
      - label: "Title"
        name: "title"
        widget: "string"
        default: "Gallery Title"
      - label: "Image"
        name: "image"
        widget: "image"
        default: "/images/placeholder.jpg"
