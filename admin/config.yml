backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "sections"
    label: "Sections"
    folder: "content/sections"
    create: true
    summary: "{{type}} - {{title}}"  # shows type and title in the CMS sidebar
    fields:
      # Read-only component type for clarity
      - label: "Component Type"
        name: "component_type"
        widget: "string"
        default: "Select Block Type"  # shows instruction for client
        readonly: true

      - label: "Block type"
        name: "type"
        widget: "select"
        options: ["hero", "testimonial", "gallery"]

      - label: "Title"
        name: "title"
        widget: "string"
        default: ""  # leave empty so the client can set meaningful title per block

      - label: "Text"
        name: "text"
        widget: "text"
        default: "Enter section text here"

      - label: "Image"
        name: "image"
        widget: "image"
        default: "/images/placeholder.jpg"
