<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netlify CMS Admin</title>
  
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@2.15.72/dist/netlify-cms.js"></script>
</head>
<body>
  <!-- No mount div needed; CMS mounts automatically -->

  <script>
    // Ensure CMS is loaded
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.CMS) {
        console.error('Netlify CMS failed to load.');
      } else {
        console.log('Netlify CMS loaded successfully.');
      }
    });
  </script>
</body>
</html>
